---
# AmneziaWG second tunnel (awg0). Runs on EU and every RU host; the config
# template is picked per side. Binaries come from the controller: amneziawg-go
# is built from the pinned tag, amneziawg-tools from the pinned release zip.
# The controller-side tasks run in check mode too (local, idempotent), so a
# --check run can still diff the copies.

- name: AWG | Build amneziawg-go on the controller
  ansible.builtin.shell:
    cmd: |
      set -e
      mkdir -p "{{ wg_awg_go_build_dir | dirname }}"
      if [ ! -d "{{ wg_awg_go_build_dir }}/.git" ]; then
        git clone -q --depth 1 --branch "{{ wg_awg_go_version }}" "{{ wg_awg_go_repo }}" "{{ wg_awg_go_build_dir }}"
      else
        git -C "{{ wg_awg_go_build_dir }}" fetch -q --depth 1 origin tag "{{ wg_awg_go_version }}"
        git -C "{{ wg_awg_go_build_dir }}" checkout -q "{{ wg_awg_go_version }}"
      fi
      cd "{{ wg_awg_go_build_dir }}"
      go build -trimpath -ldflags='-s -w' -o "amneziawg-go-{{ wg_awg_go_version }}-linux-amd64" .
    creates: "{{ wg_awg_go_build_dir }}/amneziawg-go-{{ wg_awg_go_version }}-linux-amd64"
  environment:
    CGO_ENABLED: "0"
    GOOS: linux
    GOARCH: amd64
    PATH: "/usr/local/go/bin:{{ lookup('env', 'PATH') }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  when: wg_awg_go_local_binary | length == 0

- name: AWG | Ensure the tools cache directory exists on the controller
  ansible.builtin.file:
    path: "{{ wg_awg_tools_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: AWG | Fetch amneziawg-tools release zip on the controller
  ansible.builtin.get_url:
    url: "{{ wg_awg_tools_zip_url }}"
    dest: "{{ wg_awg_tools_dir }}.zip"
    checksum: "sha256:{{ wg_awg_tools_zip_sha256 }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: AWG | Unpack amneziawg-tools on the controller
  ansible.builtin.unarchive:
    src: "{{ wg_awg_tools_dir }}.zip"
    dest: "{{ wg_awg_tools_dir }}"
    remote_src: true
    creates: "{{ wg_awg_tools_dir }}/ubuntu-22.04-amneziawg-tools/awg"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: AWG | Install amneziawg-go binary
  ansible.builtin.copy:
    src: "{{ wg_awg_go_local_binary if wg_awg_go_local_binary | length > 0 else wg_awg_go_build_dir ~ '/amneziawg-go-' ~ wg_awg_go_version ~ '-linux-amd64' }}"
    dest: "{{ wg_awg_go_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart awg0

- name: AWG | Install awg and awg-quick
  ansible.builtin.copy:
    src: "{{ wg_awg_tools_dir }}/ubuntu-22.04-amneziawg-tools/{{ item }}"
    dest: "{{ wg_awg_tools_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - awg
    - awg-quick

- name: AWG | Ensure config directory exists
  ansible.builtin.file:
    path: "{{ wg_awg_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: AWG | Deploy awg0 config
  ansible.builtin.template:
    src: "awg0-{{ 'eu' if inventory_hostname == 'vm_my_srv' else 'ru' }}.conf.j2"
    dest: "{{ wg_awg_config_dir }}/{{ wg_awg_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Sync awg0 config

- name: AWG | Deploy awg-quick@ systemd unit
  ansible.builtin.template:
    src: awg-quick@.service.j2
    dest: /etc/systemd/system/awg-quick@.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart awg0

- name: AWG | Enable and start awg-quick@{{ wg_awg_interface }}
  ansible.builtin.systemd:
    name: "awg-quick@{{ wg_awg_interface }}"
    enabled: true
    state: started
    daemon_reload: true
