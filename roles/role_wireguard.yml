---
# Deploy WireGuard mesh between EU and RU servers
# Usage:
#   ansible-playbook roles/role_wireguard.yml -i roles/hosts.yml --vault-password-file vault_password.txt
#
# Tags:
#   wireguard_eu  — configure wg0 on EU (install, config)
#   wireguard_ru  — configure wg0 on RU (install, config; also covers multi-node nodes)

- name: Deploy WireGuard
  hosts:
    - vm_my_srv
    - ru
    - nodes
  become: true

  # Role defaults load on their own; listing them under vars_files would outrank
  # inventory host vars (e.g. wg_awg_enabled) — keep only the vault here.
  vars_files:
    - wireguard/defaults/secrets.yml

  roles:
    - role: wireguard
