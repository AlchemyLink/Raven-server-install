---
- name: Reload nginx
  ansible.builtin.command: nginx -s reload
  changed_when: true

- name: Restart nginx
  ansible.builtin.service:
    name: nginx
    state: restarted

# Seamless reload: the master re-execs workers; existing TCP sessions survive
# (stats socket has expose-fd listeners, so the listening socket is handed over).
- name: Reload haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: reloaded

- name: Restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
    daemon_reload: true
