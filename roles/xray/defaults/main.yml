---

xray_common:
  inbound_tag:                           # Common tag for all Xray inbounds
    vless_reality_in: "vless-reality-in"        # Tag for VLESS + XTLS-Reality inbound
    vless_xhttp_in: "vless-xhttp-in"            # Tag for VLESS + XHTTP inbound
    vless_reality_v2_in: "vless-reality-v2-in"  # Tag for V2 VLESS + Reality (v26.3.27+)
    vless_xhttp_v2_in: "vless-xhttp-v2-in"     # Tag for V2 VLESS + XHTTP (v26.3.27+)
    api_in: "api-inbound"                       # Tag for Xray API inbound

xray_install_dir: /opt/xray                   # Xray installation directory
xray_config_dir: /etc/xray/                    # Directory for Xray configuration files
xray_service_name: xray                       # Xray systemd service name
xray_github_repo: XTLS/Xray-core              # Xray GitHub repository

# ── Xray version pin ────────────────────────────────────────────────────────
# Pin an exact tag so a role run never silently moves the server across
# upstream releases. Upstream marks nearly every release pre-release, so
# `releases/latest` can sit on one tag for months and then jump hundreds of
# commits at once — v26.3.27 → v26.7.28 is 193 commits and includes breaking
# changes (REALITY `minClientVer` default, freedom `finalRules`, config key
# renames). v26.10.21+ also makes the REALITY server require an X25519MLKEM768
# key share, which sing-box clients do not send (SagerNet/sing-box#4520), and
# makes freedom blackhole private destinations by default (v26.10.29 changes
# none of that). Bump this deliberately, after reading the release notes.
#
# Set to "" to resolve the latest stable release from the GitHub API instead
# (the previous, unpinned behaviour).
xray_version_pin: "v26.3.27"

xray_download_url: "https://github.com/{{ xray_github_repo }}/releases/download/{{ xray_version }}/Xray-linux-64.zip" # Download URL for Xray
xray_user: "xrayuser"                         # System user to run Xray
xray_group: "xrayuser"                        # System group
xray_log_dir: "/var/log/Xray"                 # Directory for Xray logs
xray_bin_dir: "/usr/local/bin"                # Directory for Xray binaries
xray_nologin_shell: "/usr/sbin/nologin"       # Shell for the Xray user (to prevent login)

# Если в xray_users у пользователя не задан flow — используется это значение (Vision для TCP/XHTTP+REALITY).
# См. https://xtls.github.io/en/config/inbounds/vless.html — flow
xray_vless_default_flow: "xtls-rprx-vision"

# ── REALITY: minimum client Xray-core version ───────────────────────────────
# Since upstream commit af7eb68 (shipped in v26.7.11) a REALITY server whose
# `minClientVer` is unset silently defaults to "26.3.27" and refuses every
# client running an older core — i.e. an Xray upgrade cuts off every user who
# has not updated their app. Set it explicitly so that decision is ours.
#
# Trade-off: older clients have a REALITY handshake pattern that censors can
# fingerprint, which is why upstream raised the floor. Once the user base has
# updated, raise this to "26.3.27" (or higher) deliberately.
#
# Empty string omits the field entirely and lets the server default apply.
xray_reality_min_client_ver: "24.9.30"


# DNS for config
xray_dns_servers:                             # List of DNS servers for Xray
  - "tcp+local://8.8.8.8"                     # Google DNS, local (bypasses proxy)
  - "tcp+local://1.1.1.1"                     # Cloudflare DNS, local (bypasses proxy)
  # DoH servers (https://) are NOT recommended here — they route
  # through the proxy chain and fail with "closed pipe" on reconnect.
xray_dns_disable_fallback: false              # Set to true to disable fallback to system DNS
xray_dns_query_strategy: "UseIPv4"            # DNS query strategy: "UseIP", "UseIPIfNonMatch", "UseIPv4", "UseIPv6"

# Log vars
xray_log_config:
  service_rotate_name: logrotate.service    # Logrotate service name for Xray logs
  log_level: "warning"                      # Log level for Xray (debug, info, warning, error, none)
  log_path: "/var/log/Xray"                # Directory for Xray logs
  access_log: "access.log"                  # Path for Xray access log
  error_log: "error.log"                    # Path for Xray error log
  logrotate_config: "/etc/logrotate.d/xray" # Path for logrotate configuration
  dns_log: false                            # Enable or disable DNS logging

# Blocked domains
xray_blocked_domains:                         # List of domains to block
  - "geosite:category-ads-all"
  - "geosite:category-ads"
  - "geosite:category-public-tracker"

# ── Direct-RU routing (EU server) ────────────────────────────────────────────
# Routes Russian traffic directly from EU server instead of through freedom.
# domainStrategy: IPIfNonMatch resolves unmatched domains to IP for geoip rules.
# Set xray_direct_ru_enabled: false to disable (all traffic → freedom).
xray_direct_ru_enabled: true

# Additional RU domains to route direct (beyond geosite:category-gov-ru and
# domain:ru/su/рф). Focus on non-.ru TLDs — .ru is already fully covered above.
# Note: domain:X matches X itself AND all subdomains.
xray_direct_ru_domains:
  # VK ecosystem — non-.ru CDN/API (vk.com = VK social, userapi.com = photo/media API,
  # vk-cdn.net = CDN; domain:ru covers vkontakte.ru, vk.ru, etc.)
  - "domain:vk.com"
  - "domain:userapi.com"          # sun0.userapi.com … sun99.userapi.com (VK media CDN)
  - "domain:vk-cdn.net"           # VK static CDN
  # OK.ru ecosystem — non-.ru CDN
  - "domain:mycdn.me"             # OK.ru/Odnoklassniki CDN (avatars, media)
  # Yandex ecosystem — non-.ru (yandex.ru/.net/.com all needed; domain:ru covers ya.ru)
  - "domain:yandex.net"           # Yandex API/CDN
  - "domain:yandex.com"           # Yandex international
  - "domain:yastatic.net"         # Yandex static assets CDN (maps, images, JS)
  # Mail.ru ecosystem — non-.ru
  - "domain:mailru.com"           # Mail.ru CDN/API (non-.ru TLD)
  # Avito — non-.ru image CDN
  - "domain:avito.st"             # Avito image CDN (00.img.avito.st … 99.img.avito.st)
  # 2GIS — non-.ru international domain
  - "domain:2gis.com"             # 2GIS maps international

# Xray Reality api configuration
xray_api:
  enable: true                               # Enable Xray API
  services:                                   # List of API services
    - "StatsService"                          # Service for statistics
    - "HandlerService"                        # Service for handling requests
    - "ReflectionService"                     # Service for list other services
    # - "LoggerService"                         # Service for logging
  inbound:
    address: "127.0.0.1"                      # API address (localhost)
    port: 10085                               # API port
    protocol: "dokodemo-door"                 # Protocol for API (dokodemo-door)"
    tag: "api-inbound"

# Effective address the API listener binds to. Defaults to the loopback address
# above (single-node). A multi-node node overrides this with its WireGuard
# address (e.g. 10.10.0.3) so the Raven control plane can reach HandlerService
# over the tunnel — see role_xray_node.yml. validate.yml still refuses any
# public IP (plaintext gRPC = full admin control); a public API requires mTLS
# termination in front, which this role does not automate.
xray_api_listen_address: "{{ xray_api.inbound.address }}"

# ── Freedom outbound: Finalmask (anti-DPI, v26.3.27+) ───────────────────────
# Rendered as the freedom outbound's streamSettings.finalmask.tcp[] — Finalmask
# is a stream setting, not a freedom `settings` key, and each entry is a
# {type, settings} pair. Stack more masks (e.g. "sudoku") by adding entries.
# See: https://xtls.github.io/en/config/outbounds/freedom.html
#
# When empty {} — finalmask block is omitted, freedom outbound is plain.

# Fragment (TCP mask) — TLS ClientHello fragmentation via Finalmask
# Splits ClientHello into small packets so DPI cannot reassemble SNI.
# NOTE: the field is `delay`, not `interval`. Finalmask's FragmentMask accepts
# packets/length/delay/maxSplit (infra/conf/transport_internet.go); `interval`
# belongs to the legacy freedom.settings.fragment and is silently ignored here,
# which leaves the fragments back-to-back with no inter-packet delay.
xray_freedom_fragment:
  packets: "tlshello"          # "tlshello" or "1-3" (TCP stream slice range)
  length: "100-200"            # fragment size in bytes (string, supports range)
  delay: "10-20"               # delay between fragments in ms (string, supports range)
# xray_freedom_fragment: {}

# Noises — send decoy packets before real UDP data
# Array of noise entries. Each entry: type (rand|str|hex|base64), packet, delay.
# xray_freedom_noises:
#   - type: "rand"
#     packet: "10-20"
#     delay: "10-16"
xray_freedom_noises: []


# ── RU geoIP outbound drop (defense-in-depth, opt-in) ──────────────────────
# Defends against the SOCKS5-leak class of attacks disclosed in
# https://habr.com/ru/articles/1020080/ — a malicious app on a user's
# Android device can bypass VpnService and force xray to make outbound
# requests to attacker-controlled RU honeypots, deanonymizing the VPN exit.
#
# When enabled, an nftables table drops every outbound packet from
# xrayuser whose destination falls in any RU CIDR (refreshed weekly
# from ipdeny.com). Trade-off: a user who deliberately routes a RU
# CDN through the proxy will see those connections fail. Our shipped
# routing rules ship `geosite:ru direct` so the typical user never hits
# this; only an admin who has built a custom proxy-RU rule will notice.
xray_geoblock_ru_enabled: false


# ── Primary inbounds (Xray-core >= v26.3.27 with mldsa65) ───────────────────
# These are the only primary inbounds — v1 (без mldsa65) удалены 2026-04-26.
xray_v2_inbounds_enabled: true

# VLESS + Reality v2 (TCP, mldsa65)
xray_v2_vless:
  tag: "vless-reality-v2-in"
  port: 4444                                  # Local port (behind nginx stream SNI routing)
  listen: "127.0.0.1"                        # Behind nginx stream SNI routing
  reality:
    dest: "dl.google.com:443"                 # TLS 1.3, H2, stable — good Reality target
    server_names:
      - "dl.google.com"

# VLESS + XHTTP + Reality v2 (HTTP/2, mldsa65)
xray_v2_xhttp:
  tag: "vless-xhttp-v2-in"
  port: 2054                                  # Local port (behind nginx stream SNI routing)
  listen: "127.0.0.1"                        # Behind nginx stream SNI routing
  network: "xhttp"
  xhttpSettings:
    mode: "packet-up"
    path: "/api/v4/sync"
    scMaxPacketSize: 1048576
  reality:
    # Cover migrated addons.mozilla.org → www.python.org (2026-06-07). Both Fastly/TLS1.3/H2;
    # python.org lab-validated on 221. Clean swap: Reality forwards the client SNI to dest, so
    # one inbound can't serve two covers → existing XHTTP clients must re-fetch the subscription.
    dest: "www.python.org:443"                # TLS 1.3, H2, Fastly CDN
    server_names:
      - "www.python.org"

# ── Fallback inbound (для прямого EU-direct подключения, минуя RU relay) ─────
# Изолированный keypair (xray_fallback_reality). НЕ включается в primary
# subscription — только в /sub/fallback/* (raven_subscribe_fallback_inbound_tags).
#
# 2026-06-06: транспорт Reality+Vision+TCP → VLESS+XHTTP+Reality (волна ТСПУ
# убивает Reality+Vision: M2 параллельные TLS + M3 TLS1.3-hammer :443; net4people
# #546). Путь остаётся EU-direct (fallback_server_host=EU) — escape-hatch на случай
# смерти relay (решение пользователя 2026-06-06; учесть: из РФ под волной прямой
# EU может не доходить — это backup-канал, не основной).
#
# Cover-домен (CNI): www.adobe.com (2026-06-06, заменил www.gstatic.com).
#   Проверен с EU-вантажа: H2, HTTP 200, без редиректа, datacenter-friendly
#   (gstatic давал проблемы; reddit/wiki — 403/redirect). Отличается от primary
#   (addons.mozilla.org). apple/microsoft отвергнуты ранее (Akamai PQC-default
#   31.01.2026 + bot-detection, MS-редиректы, бренд-SNI палится в IP+SNI-модели).
#   no-pqc у adobe не проблема: Chrome-uTLS шлёт оба keyshare, сервер берёт X25519
#   без HRR.
#
# 2026-06-06 (итерация 3): fallback приведён к АНАЛОГИЧНЫМ настройкам рабочего
# primary XHTTP (211) — sni/топология отличаются, остальное зеркалит:
#   • mode=packet-up (как primary; ранее stream-up откатан для паритета)
#   • VLESS Encryption ВКЛ (xray_vless_fallback_decryption=mlkem, ИЗОЛИРОВАННЫЙ
#     keypair) + flow xtls-rprx-vision + testseed/testpre — РОВНО как 211.
#   • КОРРЕКЦИЯ раннего тезиса: XHTTP+Vision+VLESS-Encryption РАБОТАЕТ (live 211
#     это доказывает) — поэтому PQ-слой возвращён на fallback.
# Топология СОХРАНЕНА: EU-direct (fallback_server_host=EU) — escape-hatch.
# Ключи xray_fallback_reality ротированы 2026-06-06 (изолированы от 201/211).
# SNI www.adobe.com — отличается от primary addons.mozilla.org (диверсификация).
xray_fallback_enabled: true

xray_fallback:
  tag: "vless-fallback-in"
  port: 5443                                   # Behind nginx stream SNI routing
  listen: "127.0.0.1"
  network: "xhttp"
  xhttpSettings:
    mode: "packet-up"                          # == primary 211 (аналогичные настройки)
    path: "/v2/assets/sync"                    # distinct от primary /api/v4/sync
    scMaxPacketSize: 1048576
  reality:
    dest: "www.adobe.com:443"                  # отличается от primary mozilla; H2/200/no-redirect (EU-проверен)
    server_names:
      - "www.adobe.com"

# testseed/testpre для fallback — по умолчанию = primary v2 (паритет Vision-паддинга).
# xray_fallback_testseed: [1000, 600, 1000, 300]
# xray_fallback_testpre: 3

# ── Experimental inbound 221 — STAGING CLONE of primary XHTTP (211) ────────────
# DISABLED by default (vault flag). Purpose: a faithful mirror of 211
# (vless-xhttp-v2-in) for trialing XHTTP improvements apples-to-apples WITHOUT
# touching the live primary. A working delta gets ported to 211 (xray_v2_xhttp).
#
# MIRRORS 211: XHTTP + packet-up + Vision + VLESS Encryption (reuses 211's keypair
# via xray_vless_decryption) + testseed/testpre (default = v2) + extra{xPaddingBytes}.
# Raven adds the default client xmux inside extra (same as 211, post-v0.3.1).
# ISOLATION: own port/tag/Reality-keypair (xray_experimental_reality) + own cover
# SNI (routing needs an SNI distinct from 211's addons.mozilla.org). TOPOLOGY = via
# relay (raven fallback_inbound_hosts[vless-experimental-in] = server_host). Served
# on /sub/fallback/* to a dedicated test token.
#
# Experiment by overriding xray_experimental.* (mode / path / scMaxPacketSize /
# xPaddingBytes), or add xray_experimental_testseed/_testpre to diverge from 211.
xray_experimental_enabled: false

xray_experimental:
  tag: "vless-experimental-in"
  port: 5444                                   # уникален: 4444/2054 primary, 5443 fallback
  listen: "127.0.0.1"                          # за nginx stream SNI-роутингом
  network: "xhttp"
  xhttpSettings:
    mode: "packet-up"                          # = 211 baseline
    path: "/api/v4/sync"                        # = 211 (отдельный порт/SNI → коллизии нет)
    scMaxPacketSize: 1048576
    xPaddingBytes: "100-1000"
  reality:
    # Cover-SNI ОБЯЗАН отличаться от 211 (addons.mozilla.org) — nginx роутит по SNI
    # 1:1, разный порт нужен разный SNI. www.python.org EU-проверен 2026-06-07
    # (H2/200/no-redirect/TLS1.3, Fastly). Это единственное намеренное отличие от 211.
    dest: "www.python.org:443"
    server_names:
      - "www.python.org"
# Optional: diverge testseed/testpre from 211 for an experiment (default = v2/211):
# xray_experimental_testseed: [1000, 600, 1000, 300]
# xray_experimental_testpre: 3

# Изолированный Reality keypair для эксперимента — ТОЛЬКО в secrets.yml:
#   xray_experimental_reality:
#     private_key: "..."          # xray x25519
#     spiderX: "/"
#     short_id:
#       - "..."                   # openssl rand -hex 8
# Public key НЕ нужен — raven-subscribe выводит его из private (generator.go:438).

# ── Vision testseed — custom TLS padding (Xray-core >= v25.12.8) ─────────────
# Array of 4 uint32 values controlling Vision padding behavior.
# Xray defaults: [900, 500, 900, 256]
#   [0] = content length threshold (longMin)
#   [1] = random upper bound for long padding (longMax)
#   [2] = padding offset (shortMin)
#   [3] = random upper bound for short padding (shortMax)
# See: https://github.com/XTLS/Xray-core/pull/5270
#
# When empty list [] — testseed is omitted from config, Xray uses built-in defaults.
# Set per-inbound: legacy and v2 can have different padding profiles.
# Goes into inbound "settings" alongside "clients" and "decryption".

# testseed for legacy inbounds (200-in-vless-reality, 210-in-xhttp)
xray_testseed: [900, 500, 900, 256]
# Example: xray_testseed: [900, 500, 900, 256]

# testseed for v2 inbounds (201-in-vless-reality-v2, 211-in-xhttp-v2)
# Defaults to xray_testseed if not set.
xray_v2_testseed: [1000, 600, 1000, 300]
# Example: xray_v2_testseed: [1000, 600, 1000, 300]

# ── Vision testpre — pre-connection timing obfuscation (Xray-core >= v25.12.8) ─
# uint32 controlling the number of pre-connection frames sent before real data.
# Eliminates connection timing signatures detectable by TSPU DPI.
# Introduced alongside testseed in https://github.com/XTLS/Xray-core/pull/5270
#
# When 0 (or omitted) — testpre is omitted from config, Xray uses built-in defaults.
# Goes into inbound "settings" alongside "clients", "decryption", and "testseed".

# testpre for legacy inbounds (200-in-vless-reality, 210-in-xhttp)
xray_testpre: 0

# testpre for v2 inbounds (201-in-vless-reality-v2, 211-in-xhttp-v2)
# Defaults to xray_testpre if not set.
xray_v2_testpre: 5

# V2 Reality keys — defaults to main xray_reality keys.
# Override in secrets.yml for key isolation between legacy and v2 inbounds.
# xray_v2_reality:
#   private_key: "V2PrivateKeyHere"
#   public_key: "V2PublicKeyHere"
#   spiderX: "/"
#   short_id:
#     - "shortIdHere"


